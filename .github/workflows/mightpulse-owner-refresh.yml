name: Owner-only alliance refresh
on:
  schedule:
    - cron: "30 13,23 * * *"
  workflow_dispatch:
    inputs:
      refresh_map:
        description: "Open kingdom 2399, request Update Map and wait five minutes before importing"
        type: boolean
        required: false
        default: true
      member_ids:
        description: "Optional saved-roster governor IDs, separated by commas; blank refreshes everyone"
        type: string
        required: false
        default: ""
concurrency:
  group: owner-only-mightpulse-refresh
  cancel-in-progress: false
jobs:
  warm_map:
    if: github.repository == 'Erross/BearTrapOptimizer' && github.actor == 'Erross' && github.actor_id == '33665337' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.refresh_map)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-map-refresh.txt
      - run: python -m playwright install --with-deps chromium
      - name: Open kingdom map, request refresh and wait five minutes
        run: python scripts/mightpulse_map_refresh.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kingdom-map-refresh
          path: artifacts/mightpulse-map/
          retention-days: 7
  import:
    needs: warm_map
    if: always() && (needs.warm_map.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.refresh_map && needs.warm_map.result == 'skipped')) && github.repository == 'Erross/BearTrapOptimizer' && github.actor == 'Erross' && github.actor_id == '33665337' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      snapshot_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Configure snapshot author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Refresh only the configured alliance
        env:
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
          MIGHTPULSE_SCHEDULE: ${{ github.event.schedule }}
          MIGHTPULSE_MEMBER_IDS: ${{ inputs.member_ids }}
        run: python scripts/mightpulse_import.py
      - name: Record the published snapshot source
        id: source
        run: |
          source_sha=$(git rev-parse HEAD)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
  publish:
    needs: import
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import.outputs.snapshot_sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
